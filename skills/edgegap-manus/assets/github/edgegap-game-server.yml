# Builds the game server image and pushes it to the Edgegap registry on every change to game-server/.
# Copy to .github/workflows/ in the repository Manus syncs to GitHub.
# Repository secrets (GitHub → Settings → Secrets and variables → Actions), from the Edgegap
# dashboard's Container Registry page:
#   EDGEGAP_REGISTRY_USERNAME, EDGEGAP_REGISTRY_TOKEN
# Repository variable: EDGEGAP_IMAGE, e.g. registry.edgegap.com/<project>/<image> (not a secret).
# The Edgegap API token is not needed here: new app versions are created by the developer
# (dashboard or Edgegap MCP) with the tag this job prints.
name: Edgegap game server

on:
  push:
    branches: [main]
    paths: ["game-server/**", ".github/workflows/edgegap-game-server.yml"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.edgegap.com
          username: ${{ secrets.EDGEGAP_REGISTRY_USERNAME }}
          password: ${{ secrets.EDGEGAP_REGISTRY_TOKEN }}
      - id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"   # UTC timestamp: shows when the server was last updated
      - uses: docker/build-push-action@v6
        with:
          context: game-server
          platforms: linux/amd64
          push: true
          # A plain image manifest: with the default attestations Edgegap failed to pull the image.
          provenance: false
          sbom: false
          tags: ${{ vars.EDGEGAP_IMAGE }}:${{ steps.tag.outputs.tag }}
      - run: echo "Pushed ${{ vars.EDGEGAP_IMAGE }}:${{ steps.tag.outputs.tag }} - create an app version named and tagged with it." >> "$GITHUB_STEP_SUMMARY"
